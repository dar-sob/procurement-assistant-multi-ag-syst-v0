version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
    datefmt: '%H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

loggers:
  procurement_system:
    level: INFO
    handlers: [console]
    propagate: false

  procurement_system.agents.intake.agent:
    level: DEBUG

  procurement_system.agents.procurement.agent:
    level: DEBUG

  procurement_system.agents.analyst.agent:
    level: DEBUG

  procurement_system.agents.orchestrator.agent:
    level: DEBUG

  procurement_system.observability:
    level: DEBUG
