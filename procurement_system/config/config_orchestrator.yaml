# ============================================================
# ORCHESTRATOR AGENT — Operational Configuration
# File: procurement_system/config/config_orchestrator.yaml
#
# Version:  1.0.0
# Changed:  2025-03-15
# Owner:    procurement-platform-team
#
# CHANGELOG
#   1.0.0  2025-03-15  Initial production version
#
# SCOPE — this file contains ONLY:
#   - model parameters
#   - prompt version + checksum
#   - output_validation
#   - report settings
#   - routing targets
#
# Out of scope — handled elsewhere, do NOT duplicate here:
#   - file paths                → project_paths.py
#   - field definitions/types   → schemas/analyst_schemas.py (FinalReport)
#   - enums / literals          → constants.py
#   - default numeric values    → constants.py (YAML overrides defaults)
#   - logging config            → config/logging.yaml
#   - LLM factory               → utils/llm.py
#   - technical error handling  → nodes/orchestrator_node.py (try/except)
#
# Role of this agent:
#   The Orchestrator is the LAST node in the graph.
#   It has ONE responsibility — compile and deliver the result.
#   It makes no procurement decisions. All decisions come from
#   upstream agents and are passed through SharedState.
# ============================================================

orchestrator:

  # ----------------------------------------------------------
  # IDENTITY
  # ----------------------------------------------------------
  name: orchestrator
  version: "1.0.0"

  # ----------------------------------------------------------
  # MODEL SELECTION (tier‑based)
  # ----------------------------------------------------------
  # Instead of specifying model name, temperature, max_tokens,
  # and timeout directly here, we now use a logical tier.
  # 
  # The actual values are defined centrally in:
  #   config/model_registry.yaml
  #
  # Available tiers:
  #   - reasoning_heavy  (high‑accuracy, slower, for complex tasks)
  #   - fast_cheap       (faster, cheaper, for simple tasks)
  #
  # For this agent (Analyst) we require deterministic and
  # auditable decisions, therefore we use reasoning_heavy.
  # ----------------------------------------------------------
  model_tier: reasoning_heavy

  # ----------------------------------------------------------
  # PROMPT VERSIONING
  # Logical names only — resolved to filesystem paths by
  # project_paths.py. Python verifies checksums at startup.
  #
  # How to update checksums after editing a prompt file:
  #   sha256sum procurement_system/prompts/orchestrator_system.txt
  #   sha256sum procurement_system/prompts/orchestrator_user.txt
  # ----------------------------------------------------------
  prompt:
    system_file: orchestrator_system          # → project_paths.PROMPTS_DIR
    user_file:   orchestrator_user            # → project_paths.PROMPTS_DIR
    version:     "1.0.0"
    checksums:
      system: sha256:PLACEHOLDER              # ⚠ Replace before production deploy
      user:   sha256:PLACEHOLDER              # ⚠ Replace before production deploy

  # ----------------------------------------------------------
  # REPORT SETTINGS
  # Controls the structure and content of the final report
  # and the plain-language user response.
  # ----------------------------------------------------------
  report:
    id_prefix: PO                             # report_id format: PO-YYYYMMDD-HHMMSS
    user_response_max_words: 150              # plain-language response length limit
    include_full_decision_log: true           # include all agent audit entries
    include_cost_scenarios: true              # include optimistic/realistic/pessimistic
    include_risk_details: true               # include individual risk items
    max_next_steps: 5                         # max action items in user response

  # ----------------------------------------------------------
  # OUTPUT VALIDATION
  # Field definitions live in schemas/analyst_schemas.py (FinalReport).
  # The Orchestrator produces the final customer-facing output —
  # validation failure must never result in a blank response.
  # ----------------------------------------------------------
  output_validation:
    primary_schema: orchestrator_schemas.LLMFinalReport
    strict: true
    log_failures: true
    on_failure:
      action:      retry
      max_retries: 2
      fallback:    fallback_response          # return minimal safe response to user

  # ----------------------------------------------------------
  # FALLBACK RESPONSE
  # Returned to the user when output validation fails after
  # max_retries — ensures user always receives a response.
  # Python reads this text from config and returns it directly.
  # ----------------------------------------------------------
  fallback_response:
    message: >
      Your procurement request has been received and processed.
      A detailed report could not be generated automatically at this time.
      Please contact the procurement team with your request reference
      for manual follow-up.
    current_step: orchestrator_completed
    final_decision: ESCALATE

  # ----------------------------------------------------------
  # OUTPUT STATE FIELDS
  # Contract between this agent and the shared LangGraph state.
  # ----------------------------------------------------------
  output_state_fields:

    final_report:
      type: object              # FinalReport schema
      required: true
      nullable: false
      description: >
        Complete structured procurement report.
        Includes all agent outputs, decision, conditions, next steps,
        and full decision log for audit purposes.

    message_to_user:
      type: string
      required: true
      nullable: false
      max_words: 150
      description: >
        Plain-language response for the requester.
        Must include: decision summary, recommended supplier,
        estimated cost, and numbered next steps.
        No technical jargon. No raw data.

    current_step:
      type: string
      required: true
      nullable: false
      const: orchestrator_completed
      description: Sentinel value confirming orchestrator completion

    final_decision:
      type: string
      required: true
      nullable: false
      enum: [PROCEED, PROCEED_WITH_CONDITIONS, ESCALATE, REJECT]
      description: >
        Final decision written to SharedState.
        Must match final_report.final_decision exactly.

    decision_log:
      type: object
      required: true
      nullable: false
      description: >
        Final audit entry — timestamp, report_id, final_decision.
        Appended to the accumulated decision_log in SharedState.

    errors:
      type: array
      items: string
      required: true
      nullable: false
      description: Non-fatal errors or warnings encountered

  # ----------------------------------------------------------
  # ROUTING
  # The Orchestrator is the last agent in the normal path.
  # It always routes to end after successful completion.
  #
  # Technical errors are handled by nodes/orchestrator_node.py
  # (try/except) — the fallback_response above ensures the user
  # always receives a message even on failure.
  # ----------------------------------------------------------
  routing:
    transitions:
      completed: end            # always end after successful report generation

    on_error:
      dead_letter_queue: orchestrator_errors_dlq
      notify_channel:    ops_alerts
