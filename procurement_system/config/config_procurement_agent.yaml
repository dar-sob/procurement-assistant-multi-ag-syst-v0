# ============================================================
# PROCUREMENT AGENT — Operational Configuration
# File: procurement_system/config/config_procurement_agent.yaml
#
# Version:  1.0.0
# Changed:  2025-03-15
# Owner:    procurement-platform-team
#
# CHANGELOG
#   1.0.0  2025-03-15  Initial production version
#
# SCOPE — this file contains ONLY:
#   - model parameters
#   - prompt version + checksum
#   - output_validation
#   - routing targets
#
# Out of scope — handled elsewhere, do NOT duplicate here:
#   - file paths                → project_paths.py
#   - field definitions/types   → schemas/procurement_schemas.py
#   - enums / literals          → constants.py
#   - default numeric values    → constants.py (YAML overrides defaults)
#   - buying rules content      → config/enterprise_buying_rules.yaml
#   - logging config            → config/logging.yaml
#   - LLM factory               → utils/llm.py
# ============================================================

procurement_agent:

  # ----------------------------------------------------------
  # IDENTITY
  # ----------------------------------------------------------
  name: procurement_agent
  version: "1.0.0"

  # ----------------------------------------------------------
  # MODEL SELECTION (tier‑based)
  # ----------------------------------------------------------
  # Instead of specifying model name, temperature, max_tokens,
  # and timeout directly here, we now use a logical tier.
  # 
  # The actual values are defined centrally in:
  #   config/model_registry.yaml
  #
  # Available tiers:
  #   - reasoning_heavy  (high‑accuracy, slower, for complex tasks)
  #   - fast_cheap       (faster, cheaper, for simple tasks)
  #
  # For this agent (Analyst) we require deterministic and
  # auditable decisions, therefore we use reasoning_heavy.
  # ----------------------------------------------------------
  model_tier: fast_cheap

  # ----------------------------------------------------------
  # PROMPT VERSIONING
  # Logical names only — resolved to filesystem paths by
  # project_paths.py. Python verifies checksums at startup.
  #
  # How to update checksums after editing a prompt file:
  #   sha256sum procurement_system/prompts/procurement_agent_system.txt
  #   sha256sum procurement_system/prompts/procurement_agent_user.txt
  # ----------------------------------------------------------
  prompt:
    system_file: procurement_agent_system     # → project_paths.PROMPTS_DIR
    user_file:   procurement_agent_user       # → project_paths.PROMPTS_DIR
    version:     "1.0.0"
    checksums:
      system: sha256:PLACEHOLDER              # ⚠ Replace before production deploy
      user:   sha256:PLACEHOLDER              # ⚠ Replace before production deploy

  # ----------------------------------------------------------
  # OUTPUT VALIDATION
  # Field definitions live in schemas/procurement_schemas.py.
  # on_failure.max_retries default: constants.DEFAULT_VALIDATION_MAX_RETRIES
  # ----------------------------------------------------------
  output_validation:
    primary_schema: procurement_schemas.ProcurementAgentOutput
    strict: true
    log_failures: true
    on_failure:
      action:      retry
      max_retries: 2            # override: see constants.DEFAULT_VALIDATION_MAX_RETRIES
      fallback:    escalate

  # ----------------------------------------------------------
  # OUTPUT STATE FIELDS
  # Contract between this agent and the shared LangGraph state.
  # type + required + nullable enforced by Python after LLM response.
  # ----------------------------------------------------------
  output_state_fields:

    supplier_recommendations:
      type: array
      items: object             # SupplierRecommendation schema
      required: true
      nullable: false
      min_items: 1
      max_items: 5
      description: List of supplier options — min 1, max 5, ideally 3

    procurement_strategy:
      type: string
      required: true
      nullable: false
      min_length: 30
      description: Narrative purchasing strategy referencing process type

    recommended_order_type:
      type: string
      required: true
      nullable: false
      enum: [one_time, framework, rfq, rfp]
      description: Order type aligned with process_type from intake

    negotiation_points:
      type: array
      items: string
      required: true
      nullable: false
      description: Concrete points to negotiate with selected supplier

    alternative_products:
      type: array
      items: string
      required: true
      nullable: false
      description: Alternative products or services if primary unavailable

    current_step:
      type: string
      required: true
      nullable: false
      const: procurement_completed
      description: Sentinel value confirming procurement completion

    decision_log:
      type: object
      required: true
      nullable: false
      description: Audit entry — timestamp, supplier count, order type

    errors:
      type: array
      items: string
      required: true
      nullable: false
      description: Non-fatal errors or warnings encountered

  # ----------------------------------------------------------
  # ROUTING
  # Node names must match registrations in
  # graph/procurement_graph.py.
  # retry_delay_s default: constants.DEFAULT_RETRY_DELAY_S
  # ----------------------------------------------------------
  routing:
    on_proceed:  analyst
    on_escalate: end
    on_error:
      action:            end
      max_retries:       2      # override: see constants.DEFAULT_ROUTING_MAX_RETRIES
      retry_delay_s:     5      # override: see constants.DEFAULT_RETRY_DELAY_S
      notify_channel:    ops_alerts
      dead_letter_queue: procurement_errors_dlq
